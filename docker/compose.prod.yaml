# Production stack: its own network, its own database volume, resource limits, restart policies and
# log rotation. Nothing here shares anything with other projects on the machine.
#
#   docker compose --env-file docker/.env.prod -f docker/compose.prod.yaml up -d
#
# or `make up` (see the Makefile and docs/ops.md). docker/.env.prod is not committed: copy
# docker/prod.env.example and fill it in.
name: struja-alert

x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  db:
    image: postgis/postgis:18-3.6
    restart: unless-stopped
    environment:
      POSTGRES_USER: struja
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in docker/.env.prod}
      POSTGRES_DB: struja
    volumes:
      - dbdata:/var/lib/postgresql
    networks: [internal]
    shm_size: 256mb
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U struja -d struja']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1g
    logging: *logging

  server:
    build:
      context: ..
      dockerfile: apps/server/Dockerfile
    image: struja-server:${TAG:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: [.env.prod]
    environment:
      DATABASE_URL: postgres://struja:${POSTGRES_PASSWORD}@db:5432/struja
      NODE_ENV: production
      PORT: '3000'
      RUN_JOBS: 'true'
      PAGE_SOURCE: http
      # Loads the Niš gazetteer from the bundled OSM snapshot when the database has no streets yet.
      IMPORT_GAZETTEER: 'true'
    # Published on the loopback only: a reverse proxy (an existing one, or the `caddy` profile
    # below) is the only way in from outside.
    ports:
      - '127.0.0.1:${SERVER_PORT:-3000}:3000'
    volumes:
      - backups:/backups
    networks: [internal, edge]
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/healthz').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512m
    logging: *logging

  # Copies the nightly dumps off the machine, encrypted, to a private Backblaze B2 bucket (docs/ops.md,
  # "Off-site copy"). Configured but OFF: it only runs with `--profile offsite`, once the B2_* and
  # CRYPT_* values are in docker/.env.prod. Two rclone remotes are built from the environment: "b2"
  # (the bucket, an application key limited to it) and "offsite" (a crypt remote on top of it).
  offsite:
    profiles: [offsite]
    image: rclone/rclone:1.75
    restart: unless-stopped
    entrypoint: ['/bin/sh', '/offsite-backup.sh']
    env_file: [.env.prod]
    environment:
      RCLONE_CONFIG_B2_TYPE: b2
      RCLONE_CONFIG_B2_ACCOUNT: ${B2_KEY_ID:-}
      RCLONE_CONFIG_B2_KEY: ${B2_APP_KEY:-}
      RCLONE_CONFIG_B2_HARD_DELETE: 'true'
      RCLONE_CONFIG_OFFSITE_TYPE: crypt
      RCLONE_CONFIG_OFFSITE_REMOTE: b2:${B2_BUCKET:-}
      RCLONE_CONFIG_OFFSITE_FILENAME_ENCRYPTION: standard
    volumes:
      - backups:/backups:ro
      - ./offsite-backup.sh:/offsite-backup.sh:ro
    networks: [edge]
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256m
    logging: *logging

  # Only if the machine has no reverse proxy of its own (decided once the server exists). Start it
  # with `--profile caddy`; set SITE_ADDRESSin docker/.env.prod.
  caddy:
    profiles: [caddy]
    image: caddy:2.11
    restart: unless-stopped
    depends_on: [server]
    env_file: [.env.prod]
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128m
    logging: *logging

networks:
  internal:
    internal: true
  edge:

volumes:
  dbdata:
  backups:
  caddy_data:
  caddy_config:
