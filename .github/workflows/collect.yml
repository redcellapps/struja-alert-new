name: Collect EDS fixtures

# Phase 1 fixture collector. Saves raw EDS pages three times a day (the 07, 13 and 19 slots,
# Europe/Belgrade) to the orphan branch `fixtures-collect` (never to main). The cron runs every
# hour because GitHub fires scheduled runs 1 to 5 hours late on this repository (seen 22–30 Oct
# 2026: only 3 of 24 slots were collected with a one-hour window); the script decides what a run
# is: it belongs to the latest slot that has begun, so the first successful run in
# [slot, next slot) collects it, and a slot that is already collected is skipped. DST is handled
# by the script. Minute 5 avoids the top-of-hour rush. `collect-watch.yml` raises an alarm when a
# whole day goes by with no slot.
on:
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Bypass the slot window (manual run; saved under its own manual-* key)'
        type: boolean
        default: false

concurrency:
  group: collect-fixtures
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Check out the fixtures branch (create it on first run)
        run: |
          if git ls-remote --exit-code --heads origin fixtures-collect >/dev/null 2>&1; then
            git fetch --depth=1 origin fixtures-collect
            git worktree add -B fixtures-collect fixtures-data origin/fixtures-collect
          else
            git worktree add --orphan -b fixtures-collect fixtures-data
          fi

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter "@struja/scripts..."

      - name: Collect
        run: pnpm --filter @struja/scripts collect
        env:
          SCRAPER_CONTACT_EMAIL: ${{ secrets.SCRAPER_CONTACT_EMAIL }}
          FIXTURES_DIR: ${{ github.workspace }}/fixtures-data
          COLLECT_CITIES: Nis,Kraljevo,NoviSad,Kragujevac
          FORCE: ${{ inputs.force && '1' || '0' }}

      - name: Commit and push new fixtures
        working-directory: fixtures-data
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Collect EDS fixtures $(date -u +%Y-%m-%dT%H:%MZ)"
          git push origin fixtures-collect
